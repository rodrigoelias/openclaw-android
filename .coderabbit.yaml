# CodeRabbit configuration for Hermes on Android
# Documentation: https://docs.coderabbit.ai/reference/configuration

language: en-US
early_access: false

reviews:
  request_changes_workflow: false
  high_level_summary: true
  sequence_diagrams: true

  auto_review:
    enabled: true
    base_branches:
      - main
    drafts: false

  poem: false

  reviewer:
    enabled: true
    auto_assign: false

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

chat:
  auto_reply: true

# Path filters — ignore generated and build artifacts
path_filters:
  - "!**/build/**"
  - "!**/node_modules/**"
  - "!**/.gradle/**"
  - "!**/android/www/dist/**"
  - "!**/*.apk"

# Review instructions specific to this project
review_instructions:
  - "Ensure shell scripts are bash-compatible and follow scripts/lib.sh conventions"
  - "Check Termux compatibility — paths under $PREFIX, no /etc/, no systemd"
  - "Verify install.sh / update.sh / uninstall.sh remain idempotent"
  - "Watch for breaking the platforms/<name>/ abstraction — orchestrators must stay platform-agnostic"
  - "Check that hermes-agent upstream changes (setup-hermes.sh, constraints-termux.txt) are still respected"
  - "When touching Kotlin code in android/, follow Android best practices and lifecycle handling"
  - "Ensure no hardcoded paths that break on different Android versions"

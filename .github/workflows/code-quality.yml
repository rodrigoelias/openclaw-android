name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          find . -name '*.sh' \
            -not -path './android/app/build/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 --no-run-if-empty shellcheck --format=gcc

  bash-syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate top-level orchestrators
        run: |
          for f in install.sh bootstrap.sh update.sh update-core.sh \
                   uninstall.sh install-tools.sh post-setup.sh ha.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Validate platform scripts
        run: |
          for f in platforms/hermes-agent/*.sh scripts/*.sh tests/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint
        run: markdownlint-cli2 '**/*.md' '!node_modules' '!android/www/node_modules' '!android/www/dist' '!android/app/build'

  kotlin-lint:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    if: false  # APK is inherited from openclaw-android and not yet adapted; re-enable once android/ targets hermes
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

name: Android Build

# The standalone APK was inherited from openclaw-android and has not yet been
# adapted to bundle hermes-agent. Disabled until android/ is rebranded.
on:
  workflow_dispatch:

jobs:
  build-www:
    name: Build WebView UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/www
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: android/www/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../www.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: www-zip
          path: android/www/www.zip

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build-www
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
